name: Build and publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.6.3 and templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fL "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL "$base/Godot_v4.6.3-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/templates.zip -d /tmp/export
          mkdir -p ~/.local/share/godot/export_templates/4.6.3.stable
          cp /tmp/export/templates/* ~/.local/share/godot/export_templates/4.6.3.stable/
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import, test and export
        run: |
          Godot_v4.6.3-stable_linux.x86_64 --headless --editor --path . --import
          Godot_v4.6.3-stable_linux.x86_64 --headless --path . -- --self-test
          mkdir -p build/web
          Godot_v4.6.3-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
